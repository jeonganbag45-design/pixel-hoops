<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e1c">
<title>Hoops 3D</title>
<style>
  /* a clean broadcast look: frosted glass panels, heavy italic type, team colors, rounded everything */
  :root {
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, -apple-system, sans-serif;
    --glass: rgba(12, 16, 32, .62); --glass-hi: rgba(255, 255, 255, .1); --line: rgba(255, 255, 255, .14);
    --text: #f5f7ff; --dim: #a7b0cc; --hot: #ff7a1a; --gold: #ffd23f; --good: #34e08a; --bad: #ff4d5e;
    --r: 14px; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0e1c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .ui { position: fixed; pointer-events: none; font-family: var(--font); color: var(--text); }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
  .glass { background: var(--glass); backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

  /* ---- the scoreboard bug ---- */
  #score { top: 12px; left: 50%; transform: translateX(-50%); display: none; align-items: stretch; border-radius: 16px; overflow: hidden;
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); box-shadow: var(--shadow); }
  #score span, #score b { display: flex; align-items: center; padding: 0 14px; height: 48px; }
  #na, #nb { font-weight: 800; font-size: 15px; letter-spacing: .04em; min-width: 92px; justify-content: center; }
  #na { box-shadow: inset 5px 0 0 var(--ca, #fff); } #nb { box-shadow: inset -5px 0 0 var(--cb, #fff); }
  #score b { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 56px; justify-content: center; background: rgba(255, 255, 255, .06); }
  #clock { font-weight: 900; font-size: 18px; color: var(--gold); font-variant-numeric: tabular-nums; min-width: 78px; justify-content: center; background: rgba(0, 0, 0, .35); }

  /* ---- SP and stamina, under the scoreboard ---- */
  #bars { top: 70px; left: 50%; transform: translateX(-50%); display: none; gap: 120px; }
  .bar { position: relative; width: 170px; height: 10px; border-radius: 99px; background: rgba(10, 14, 28, .7); border: 1px solid var(--line); overflow: visible; }
  .bar i { position: absolute; left: 0; top: 0; height: 6px; border-radius: 99px; display: block; transition: width .15s; box-shadow: 0 0 10px currentColor; }
  .bar u { position: absolute; left: 0; bottom: -6px; height: 3px; border-radius: 99px; background: var(--good); display: block; text-decoration: none; opacity: .9; }
  .bar b { position: absolute; top: 14px; left: 0; font-size: 12px; font-weight: 900; font-style: italic; letter-spacing: .06em; color: var(--gold); white-space: nowrap; text-shadow: 0 0 12px rgba(255, 210, 63, .6); }
  .bar.r i, .bar.r u { left: auto; right: 0; } .bar.r b { left: auto; right: 0; }

  /* ---- words in the world: what just happened ---- */
  #fx { inset: 0; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--font); font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: .02em; white-space: nowrap;
    -webkit-text-stroke: 1px rgba(0, 0, 0, .55); text-shadow: 0 3px 0 rgba(0, 0, 0, .35), 0 0 18px rgba(0, 0, 0, .35); animation: popIn .22s cubic-bezier(.2, 1.6, .4, 1); }
  .pop.big { font-size: 44px; -webkit-text-stroke: 1.5px rgba(0, 0, 0, .6); }
  @keyframes popIn { from { transform: translate(-50%, -50%) scale(.4); } to { transform: translate(-50%, -50%) scale(1); } }
  /* what you can do right now: a badge over your head */
  #cue { position: absolute; transform: translate(-50%, -50%); display: none; white-space: nowrap; font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: .04em;
    padding: 6px 16px; border-radius: 99px; background: rgba(10, 14, 28, .75); border: 2px solid currentColor; box-shadow: 0 0 22px currentColor; animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: translate(-50%, -50%) scale(1.08); } }
  /* the shot meter: let go in the green */
  #meter { position: absolute; width: 90px; height: 10px; border-radius: 99px; background: rgba(10, 14, 28, .8); border: 1px solid var(--line); display: none; transform: translate(-50%, -50%); overflow: hidden; }
  #meter i { position: absolute; left: 38%; width: 24%; top: 0; bottom: 0; background: var(--good); box-shadow: 0 0 10px var(--good); }
  #meter u { position: absolute; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: #fff; }

  /* ---- center: the countdown and the final result ---- */
  #center { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .count { font-size: 140px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 0 8px 0 rgba(0, 0, 0, .3), 0 0 50px rgba(255, 122, 26, .6); animation: countIn .45s cubic-bezier(.2, 1.4, .4, 1); }
  .count.go { color: var(--gold); }
  @keyframes countIn { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result { pointer-events: auto; min-width: 440px; padding: 26px 34px 24px; border-radius: 22px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); box-shadow: var(--shadow), inset 0 3px 0 var(--c); animation: countIn .35s ease-out; }
  .result h2 { margin: 6px 0 10px; font-size: 44px; font-weight: 900; font-style: italic; color: var(--c); }
  .final { display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 800; }
  .final b { font-size: 54px; font-weight: 900; font-variant-numeric: tabular-nums; } .final i { font-size: 36px; color: var(--dim); font-style: normal; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .row button, .row a { font-family: var(--font); font-size: 15px; font-weight: 800; color: var(--text); background: var(--glass-hi); border: 1px solid var(--line); border-radius: 99px; padding: 11px 20px; text-decoration: none; cursor: pointer; }
  .row .primary { background: linear-gradient(135deg, var(--hot), #ff3d6e); border: 0; box-shadow: 0 6px 20px rgba(255, 90, 60, .45); }
  .row button:hover, .row a:hover { filter: brightness(1.15); }

  /* ---- the skill banner ---- */
  #cutin { top: 30%; left: 0; right: 0; height: 96px; display: flex; align-items: center; padding-left: 9%; transform: translateX(-110%); transition: transform .2s cubic-bezier(.2, 1.2, .4, 1); }
  #cutin.r { justify-content: flex-end; padding: 0 9% 0 0; transform: translateX(110%); text-align: right; }
  #cutin.on { transform: translateX(0); }
  #cutin i { position: absolute; inset: 10px 0; background: linear-gradient(90deg, transparent, var(--d) 18%, var(--c) 60%, transparent); transform: skewY(-3deg); opacity: .9; z-index: -1; }
  #cutin b { display: block; font-size: 46px; font-weight: 900; font-style: italic; text-shadow: 0 4px 0 rgba(0, 0, 0, .3); }
  #cutin small { font-size: 15px; font-weight: 800; letter-spacing: .1em; opacity: .85; } #cutin .tag { color: #fff; opacity: .8; }

  /* ---- character select ---- */
  #sel { inset: 0; display: none; flex-direction: column; align-items: center; padding: 18px 16px 16px; pointer-events: none; }
  #sel header { text-align: center; }
  .brand { font-size: 14px; font-weight: 900; letter-spacing: .3em; color: var(--dim); } .brand em { color: var(--hot); font-style: normal; }
  #sel h1 { margin: 2px 0 0; font-size: 34px; font-weight: 900; font-style: italic; letter-spacing: .01em; }
  #sel button { pointer-events: auto; font-family: var(--font); cursor: pointer; }
  #tabs { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .tab { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 8px 16px; font-size: 13px; font-weight: 800; letter-spacing: .06em; transition: all .15s; }
  .tab:hover { color: #fff; }
  .tab.on { color: #fff; background: var(--c); border-color: transparent; box-shadow: 0 6px 20px color-mix(in srgb, var(--c) 55%, transparent); }
  #card { margin-top: auto; display: flex; gap: 22px; align-items: stretch; padding: 18px 22px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); box-shadow: var(--shadow), inset 0 3px 0 var(--c); max-width: 920px; }
  .who { min-width: 190px; }
  .who b { display: block; font-size: 38px; font-weight: 900; font-style: italic; color: var(--c); line-height: 1; }
  .who i { display: block; margin: 4px 0 12px; font-style: normal; font-size: 13px; font-weight: 700; color: var(--dim); letter-spacing: .06em; }
  .stats { display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px; align-items: center; font-size: 11px; font-weight: 800; color: var(--dim); }
  .sbar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; } .sbar u { display: block; height: 100%; border-radius: 99px; background: var(--c); }
  .abil { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .ab { padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); }
  .ab b { display: block; margin: 4px 0 4px; font-size: 17px; font-weight: 900; font-style: italic; }
  .ab em { display: block; font-style: normal; font-size: 12px; line-height: 1.4; color: var(--dim); }
  .ab.sk { background: linear-gradient(160deg, rgba(255, 210, 63, .14), rgba(255, 255, 255, .04)); } .ab.sk b { color: var(--gold); }
  #selBtns { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  #selBtns button { color: #fff; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 99px; font-size: 22px; font-weight: 900; width: 48px; height: 48px; }
  #selBtns #playB { width: auto; padding: 0 54px; font-size: 18px; letter-spacing: .12em; background: linear-gradient(135deg, var(--hot), #ff3d6e); border: 0; box-shadow: 0 8px 24px rgba(255, 90, 60, .45); }
  #sel small { color: var(--dim); font-size: 12px; font-weight: 700; margin-top: 8px; letter-spacing: .04em; }

  /* ---- bottom help, view switch ---- */
  #help { bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--dim); white-space: nowrap; padding: 7px 14px; border-radius: 99px;
    background: rgba(10, 14, 28, .55); border: 1px solid var(--line); max-width: 96vw; overflow: hidden; text-overflow: ellipsis; }
  #viewB { position: fixed; top: 16px; right: 16px; display: none; font-family: var(--font); font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--text); background: var(--glass);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 99px; padding: 9px 16px; cursor: pointer; z-index: 3; }

  /* ---- touch controls: frosted circles ---- */
  #touch { inset: 0; display: none; }
  #touch .b { position: absolute; pointer-events: auto; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .28); background: rgba(12, 16, 32, .42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff; font-family: var(--font); font-weight: 900; font-style: italic; letter-spacing: .04em; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); transition: transform .08s; }
  #touch .b.on { transform: scale(.92); background: rgba(255, 122, 26, .7); }
  #touch .b.gold { border: 2px solid var(--gold); box-shadow: 0 0 24px rgba(255, 210, 63, .7); }
  #bShoot { width: 112px; height: 112px; right: 36px; bottom: 36px; font-size: 18px; background: linear-gradient(135deg, rgba(255, 122, 26, .75), rgba(255, 61, 110, .65)) !important; border: 0 !important; }
  #bJump { width: 72px; height: 72px; right: 164px; bottom: 26px; font-size: 13px; }
  #bDash { width: 72px; height: 72px; right: 58px; bottom: 164px; font-size: 13px; }
  #bMove { width: 64px; height: 64px; right: 170px; bottom: 112px; font-size: 12px; }
  #bSkill { width: 64px; height: 64px; right: 150px; bottom: 196px; font-size: 12px; }
  #stick { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: rgba(12, 16, 32, .3); display: none; transform: translate(-50%, -50%); }
  #knob { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, .85); box-shadow: 0 4px 14px rgba(0, 0, 0, .4); display: none; transform: translate(-50%, -50%); }

  #rotate { position: fixed; inset: 0; background: #0a0e1c; color: #fff; font-family: var(--font); font-size: 22px; font-weight: 800; display: none; align-items: center; justify-content: center; z-index: 9; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (max-height: 480px) {
    #card { padding: 12px 14px; gap: 12px; } .who b { font-size: 28px; } .ab { padding: 8px 10px; } .ab b { font-size: 14px; } .ab em { font-size: 11px; }
    #sel h1 { font-size: 24px; } .count { font-size: 100px; } .result { min-width: 340px; padding: 18px 22px; } .result h2 { font-size: 32px; }
    #bars { top: 64px; gap: 80px; } .bar { width: 130px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="score"><span id="na"></span><b id="sa">0</b><span id="clock">1:00</span><b id="sb">0</b><span id="nb"></span></div>
<div class="ui" id="fx"><div id="cue"></div><div id="meter"><i></i><u></u></div></div>
<div class="ui" id="bars"><div class="bar" id="spA"><i></i><u></u><b></b></div><div class="bar r" id="spB"><i></i><u></u><b></b></div></div>
<div class="ui" id="cutin"></div>
<button id="viewB"></button>
<div class="ui" id="center"></div>
<div class="ui" id="sel"></div>
<div class="ui" id="help"></div>
<div class="ui" id="touch"><div id="stick"></div><div id="knob"></div><div class="b" id="bDash">DASH</div><div class="b" id="bMove">MOVE</div><div class="b" id="bSkill">SKILL</div><div class="b" id="bJump">JUMP</div><div class="b" id="bShoot">SHOOT</div></div>
<div id="rotate">가로로 돌려주세요</div>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }</script>
<script type="module" src="game3d.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js", { updateViaCache: "none" }).catch(() => {});</script>
</body>
</html>
