<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pixel Hoops 3D (test)</title>
<style>
  @font-face { font-family: "G11"; src: url("../fonts/Galmuri11-Bold.woff2") format("woff2"); }
  @font-face { font-family: "G9"; src: url("../fonts/Galmuri9.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; background: #07060c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; display: block; }
  .ui { position: fixed; pointer-events: none; font-family: "G11", monospace; color: #fff; text-shadow: 2px 0 #0d0a14, -2px 0 #0d0a14, 0 2px #0d0a14, 0 -2px #0d0a14; }
  #score { top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; background: rgba(13,10,20,.85); padding: 6px 16px; border: 2px solid #5a5070; font-size: 18px; }
  #score b { font-size: 26px; }
  #clock { color: #ffe03c; min-width: 60px; text-align: center; }
  #fx { inset: 0; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-size: 16px; white-space: nowrap; }
  .pop.big { font-size: 30px; }
  #cue { position: absolute; transform: translate(-50%, -50%); font-size: 24px; color: #ffe03c; display: none; white-space: nowrap; }
  #meter { position: absolute; width: 64px; height: 8px; background: #2a2440; border: 2px solid #0d0a14; display: none; transform: translate(-50%, -50%); }
  #meter i { position: absolute; left: 38%; width: 24%; top: 0; bottom: 0; background: #5ad84a; }
  #meter u { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #fff; }
  #center { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 48px; text-align: center; gap: 10px; }
  #center small { font-family: "G9", monospace; font-size: 18px; color: #c8c0dc; }
  #center a, #center button { pointer-events: auto; font-family: "G11", monospace; font-size: 18px; color: #fff; background: #f53cd1; border: 2px solid #ff86e6; padding: 8px 18px; text-decoration: none; cursor: pointer; }
  #center a { background: #3a3550; border-color: #5a5070; }
  #help { bottom: 8px; left: 50%; transform: translateX(-50%); font-family: "G9", monospace; font-size: 14px; color: #c8c0dc; white-space: nowrap; }
  #touch { inset: 0; display: none; }
  #touch .b { position: absolute; pointer-events: auto; border-radius: 50%; border: 3px solid #fff; background: rgba(13,10,20,.45); color: #fff; font-family: "G11", monospace; display: flex; align-items: center; justify-content: center; }
  #touch .b.on { background: rgba(255,224,60,.75); color: #0d0a14; }
  #touch .b.gold { border-color: #ffe03c; box-shadow: 0 0 18px #ffe03c; }
  #bShoot { width: 110px; height: 110px; right: 40px; bottom: 40px; font-size: 18px; }
  #bJump { width: 70px; height: 70px; right: 165px; bottom: 30px; font-size: 14px; }
  #bDash { width: 70px; height: 70px; right: 60px; bottom: 165px; font-size: 14px; }
  #stick { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); display: none; transform: translate(-50%, -50%); }
  #knob { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.7); display: none; transform: translate(-50%, -50%); }
  #sel { inset: 0; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0 12px; pointer-events: none; }
  #sel h1 { margin: 0; font-size: 26px; color: #ffe03c; font-weight: normal; }
  #sel button { pointer-events: auto; font-family: "G11", monospace; cursor: pointer; }
  #tabs { display: flex; gap: 6px; margin-top: 6px; }
  .tab { background: rgba(13,10,20,.85); color: #c8c0dc; border: 2px solid #5a5070; padding: 5px 10px; font-size: 15px; }
  .tab.on { color: #fff; border-color: var(--c); box-shadow: 0 0 0 2px var(--c) inset; }
  #card { margin-top: auto; background: rgba(13,10,20,.9); border: 2px solid #5a5070; padding: 8px 18px; display: flex; gap: 18px; align-items: center; }
  #card b { font-size: 30px; font-weight: normal; }
  #card i { font-style: normal; font-family: "G9", monospace; color: #c8c0dc; font-size: 15px; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 2px 10px; font-family: "G9", monospace; font-size: 13px; align-items: center; }
  .pips { display: flex; gap: 3px; } .pips u { display: block; width: 12px; height: 8px; }
  #selBtns { display: flex; gap: 10px; margin-top: 8px; }
  #selBtns button { background: #3a3550; color: #fff; border: 2px solid #5a5070; font-size: 18px; padding: 6px 16px; }
  #selBtns #playB { background: #f53cd1; border-color: #ff86e6; padding: 6px 36px; }
  #sel small { font-family: "G9", monospace; color: #9088a4; font-size: 13px; margin-top: 4px; }
  #rotate { position: fixed; inset: 0; background: #07060c; color: #fff; font-family: "G11", monospace; font-size: 22px; display: none; align-items: center; justify-content: center; z-index: 9; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="score"><span id="na"></span><b id="sa">0</b><span id="clock">1:00</span><b id="sb">0</b><span id="nb"></span></div>
<div class="ui" id="fx"><div id="cue"></div><div id="meter"><i></i><u></u></div></div>
<div class="ui" id="center"></div>
<div class="ui" id="sel"></div>
<div class="ui" id="help"></div>
<div class="ui" id="touch"><div id="stick"></div><div id="knob"></div><div class="b" id="bDash">DASH</div><div class="b" id="bJump">JUMP</div><div class="b" id="bShoot">SHOOT</div></div>
<div id="rotate">가로로 돌려주세요</div>
<script type="module" src="game3d.js"></script>
</body>
</html>
