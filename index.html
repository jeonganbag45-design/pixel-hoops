<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07060b">
<meta name="apple-mobile-web-app-title" content="Pixel Hoops">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Hoops</title>
<style>
  :root { --bg: #07060b; --edge: #241c38; --btn: rgba(22, 20, 31, 0.55); --btn-line: rgba(160, 150, 190, 0.55); --text: #f2ead8; --hot: rgba(245, 60, 209, 0.55); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); overflow: hidden; display: grid; place-items: center; touch-action: none; overscroll-behavior: none;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: relative; width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; background: #000;
           box-shadow: 0 0 0 2px var(--edge), 0 0 60px rgba(245, 60, 209, 0.12); cursor: pointer; touch-action: none; }

  /* touch controls: a slide pad on the left, the action buttons on the right; they sit over the corners of the court
     (and in the black side bars on wide phones), see-through so the floor stays readable */
  #touch { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 5;
           padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  .touch #touch { display: block; }
  .ctl { pointer-events: auto; touch-action: none; position: absolute; border: 2px solid var(--btn-line); background: var(--btn); color: var(--text);
         font: 700 clamp(10px, 2.2vh, 14px)/1 ui-monospace, monospace; letter-spacing: .04em; display: grid; place-items: center; border-radius: 10px; }
  .ctl.on { background: var(--hot); border-color: #ff86e6; }
  #pad { left: max(14px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: clamp(130px, 34vh, 210px); height: clamp(64px, 17vh, 100px);
         grid-template-columns: 1fr 1fr; place-items: center; border-radius: 50px; }
  #pad span { font-size: clamp(18px, 5vh, 30px); opacity: .8; }
  #pad.l span:first-child, #pad.r span:last-child { color: #ff86e6; opacity: 1; }
  .act { --s: clamp(54px, 15vh, 84px); width: var(--s); height: var(--s); border-radius: 50%; }
  #b-shoot { right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); --s: clamp(64px, 18vh, 100px); border-color: rgba(255, 224, 60, .7); }
  #b-jump  { right: calc(max(14px, env(safe-area-inset-right)) + clamp(64px, 18vh, 100px) + 10px); bottom: max(12px, env(safe-area-inset-bottom)); }
  #b-dash  { right: calc(max(14px, env(safe-area-inset-right)) + clamp(64px, 18vh, 100px) + 10px); bottom: calc(max(12px, env(safe-area-inset-bottom)) + clamp(54px, 15vh, 84px) + 10px); --s: clamp(46px, 12vh, 68px); }
  #b-sp    { right: max(14px, env(safe-area-inset-right)); bottom: calc(max(12px, env(safe-area-inset-bottom)) + clamp(64px, 18vh, 100px) + 10px); --s: clamp(46px, 12vh, 68px); border-color: rgba(255, 194, 60, .7); }
  #b-pause { top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); margin-left: clamp(90px, 26vw, 220px); width: 40px; height: 32px; border-radius: 8px; }
  /* in menus only pause hides; the pad and buttons fade so a tap goes to the canvas */
  .menu #touch .ctl:not(#b-pause) { opacity: .25; pointer-events: none; }
  .menu #b-pause { display: none; }

  /* phones held upright: ask to turn */
  #rotate { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: var(--bg); color: var(--text); z-index: 10;
            font: 700 16px/1.6 ui-monospace, monospace; padding: 24px; }
  #rotate b { display: block; font-size: 44px; margin-bottom: 12px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { .touch #rotate { display: grid; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
</div>
<div id="touch">
  <div id="pad" class="ctl"><span>&lt;</span><span>&gt;</span></div>
  <button id="b-sp" class="ctl act" data-k="KeyE">SP</button>
  <button id="b-dash" class="ctl act" data-k="KeyS">DASH</button>
  <button id="b-jump" class="ctl act" data-k="KeyW">JUMP</button>
  <button id="b-shoot" class="ctl act" data-k="KeyF">SHOOT</button>
  <button id="b-pause" class="ctl" data-k="Escape">II</button>
</div>
<div id="rotate"><div><b>📱</b>가로로 돌려주세요<br>Rotate your phone</div></div>
<script type="module" src="game.js"></script>
<script>
  // the offline cache that makes it an installable app (browsers only allow it on https or localhost)
  if ("serviceWorker" in navigator && window.isSecureContext) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
